services:
  - type: web
    name: ai-forum
    env: node
    buildCommand: npm run build
    startCommand: npm start
    envVars:
      - key: PORT
        value: 10000
      - key: NODE_ENV
        value: production
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_EXPIRE
        value: 7d
      - key: GROK_API_KEY
        sync: false
      - key: GROK_API_URL
        value: https://api.x.ai/v1/chat/completions
      - key: GROK_MODEL
        value: grok-3-mini
      - key: ADMIN_EMAIL
        value: admin@aiforum.com
      - key: ADMIN_PASSWORD
        sync: false
